[project]
name = "backend"
version = "0.1.0"
description = "HTTPS session and secure WebSocket demo backend for mobile"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.142.2",
]

[project.scripts]
backend = "backend:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"
